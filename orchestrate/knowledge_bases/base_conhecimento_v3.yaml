spec_version: v1
kind: knowledge_base
name: base_conhecimento_paraisogold_v3
description: 'Conteúdo oficial da Central Gold (ParaísoGold Loteamentos) para atendimento
  a compradores de lotes: boletos e carnês, Área do Cliente, compensação e pagamentos,
  atraso, negativação, atualização monetária, antecipação de parcelas, amortização,
  quitação, renegociação, rescisão, distrato e direito de arrependimento, transferência
  de titularidade, contrato, proposta e assinatura, cadastro, IPTU, condomínio e taxa
  de lixo, escritura, registro, ITBI e ITCMD, compra de lotes e pós-venda, corretores
  e imobiliárias parceiras, lote, construção, alvará, demarcação e metragem, casos
  jurídicos como cobrança jurídica, carta rogatória e desapropriação, e canais oficiais
  de atendimento, endereço e horários.'
